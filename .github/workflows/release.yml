name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Verify tests pass before release
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          # Extract the changelog section for this version (## [x.y.z] ... up to next ## [).
          awk -v v="${{ steps.version.outputs.version }}" '
            index($0, "## [" v "]") != 0 { insec=1; next }
            insec && /^## \[/ { insec=0; next }
            insec { print }
          ' CHANGELOG.md > /tmp/notes.md
          # Fall back to a simple message if the section was empty.
          if [ ! -s /tmp/notes.md ]; then
            echo "Release ${{ steps.version.outputs.version }}" > /tmp/notes.md
          fi
          {
            echo "notes<<EOF"
            cat /tmp/notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
